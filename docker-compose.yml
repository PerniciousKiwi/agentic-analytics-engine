services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardinal
      POSTGRES_USER: cardinal_app
      POSTGRES_PASSWORD: cardinal_app_local
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - statement_timeout=30000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardinal_app -d cardinal"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "echo > /dev/tcp/127.0.0.1/6333"
      interval: 5s
      timeout: 5s
      retries: 10
    
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cardinal
      POSTGRES_USER: cardinal_app
      POSTGRES_PASSWORD: cardinal_app_local

      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - uv
      - run
      - uvicorn
      - cardinal.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  pgdata:
  qdrantdata: