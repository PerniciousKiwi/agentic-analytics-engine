[project]
name = "cardinal"
version = "0.1.0"
description = "Agentic analytics engine"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlglot>=25.24,<26",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "qdrant-client>=1.12,<2",
    "redis>=5.2,<6",
    "httpx>=0.27,<0.29",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sse-starlette>=2.1,<3",
    "jinja2>=3.1,<4",
    "structlog>=24.4,<25",
    "tenacity>=9.0,<10",
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "onnxruntime>=1.19,<2",
    "transformers>=4.45,<5",
    "tokenizers>=0.20,<1",
    "sentence-transformers>=3.2,<4",
    "mlflow>=2.17,<3",
    "langfuse>=2.53,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.13,<1",
    "rich>=13.9,<14",
    "mcp>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
    "hypothesis>=6.115,<7",
    "locust>=2.32,<3",
]

warehouse = [
    "dbt-core>=1.8,<2",
    "dbt-postgres>=1.8,<2",
]

ui = [
    "streamlit>=1.39,<2",
    "plotly>=5.24,<6",
]

eval = [
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardinal"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/cardinal",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "ARG",
    "PTH",
    "RUF",
    "ASYNC",
    "S",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "mlflow.*",
    "langfuse.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

markers = [
    "integration: tests that require Docker services",
    "slow: tests that take more than 30 seconds",
    "llm: tests that require Ollama",
]